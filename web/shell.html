<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>HIT 'EM ALL</title>
  <style>
    :root {
      --game-width: 1600;
      --game-height: 800;
      color-scheme: dark;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* Canvas is sized by JS to the largest box that fits the window
       while keeping the game's native aspect ratio (1600:800 = 2:1). */
    canvas.emscripten {
      display: block;
      background: #000;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
      outline: none;
      touch-action: none;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #000;
      color: #f2d675;
      font-family: Georgia, 'Times New Roman', serif;
      letter-spacing: 0.08em;
      z-index: 10;
      transition: opacity 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-title {
      font-size: clamp(20px, 4vw, 32px);
      text-transform: uppercase;
    }

    #loading-bar-track {
      width: min(60vw, 360px);
      height: 10px;
      border: 1px solid #f2d675;
      border-radius: 6px;
      overflow: hidden;
      background: rgba(242, 214, 117, 0.1);
    }

    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #f2d675;
      transition: width 0.2s ease;
    }

    #loading-text {
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <div id="loading-overlay">
    <div id="loading-title">HIT 'EM ALL</div>
    <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
    <div id="loading-text">Loading...</div>
  </div>

  <script>
    const GAME_WIDTH = 1600;
    const GAME_HEIGHT = 800;
    const ASPECT_RATIO = GAME_WIDTH / GAME_HEIGHT;

    const canvas = document.getElementById('canvas');
    const container = document.getElementById('game-container');

    // The canvas backing store stays fixed at the game's native resolution
    // (set by InitWindow in main.c); only its CSS display size changes here.
    // This keeps the game's own coordinate system untouched while scaling
    // the whole frame to fit the window, preserving the aspect ratio with
    // letterboxing/pillarboxing on the sides that don't fit.
    function resizeCanvas() {
      const availableWidth = container.clientWidth;
      const availableHeight = container.clientHeight;

      let width = availableWidth;
      let height = width / ASPECT_RATIO;

      if (height > availableHeight) {
        height = availableHeight;
        width = height * ASPECT_RATIO;
      }

      canvas.style.width = Math.floor(width) + 'px';
      canvas.style.height = Math.floor(height) + 'px';
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resizeCanvas);
    }

    // raylib/GLFW's web backend clears canvas.style.width/height during
    // InitWindow (and on later SetWindowSize/fullscreen-toggle calls),
    // which would otherwise undo our letterboxed sizing. Watch the style
    // attribute and immediately re-apply our sizing whenever that happens.
    let restoringStyle = false;
    const styleObserver = new MutationObserver(function () {
      if (restoringStyle) return;
      if (canvas.style.width !== '' && canvas.style.height !== '') return;
      restoringStyle = true;
      resizeCanvas();
      restoringStyle = false;
    });
    styleObserver.observe(canvas, { attributes: true, attributeFilter: ['style'] });

    // Prevent touch scrolling/bouncing on mobile from interfering with aiming.
    document.body.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingBarFill = document.getElementById('loading-bar-fill');
    const loadingText = document.getElementById('loading-text');

    var Module = {
      canvas: canvas,
      print: function () {},
      printErr: function () {},
      setStatus: function (text) {
        if (!text) {
          loadingOverlay.classList.add('hidden');
          return;
        }
        const match = text.match(/([\d.]+)\s*\/\s*([\d.]+)/);
        if (match) {
          const pct = (parseFloat(match[1]) / parseFloat(match[2])) * 100;
          loadingBarFill.style.width = pct + '%';
        }
        loadingText.textContent = text;
      },
      monitorRunDependencies: function (left) {
        if (left === 0) {
          setTimeout(function () {
            loadingOverlay.classList.add('hidden');
          }, 200);
        }
      },
      onRuntimeInitialized: function () {
        resizeCanvas();
      }
    };

    Module.setStatus('Downloading...');
    resizeCanvas();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
